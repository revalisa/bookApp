<ion-header>
  <ion-toolbar>
    <ion-title>{{ book ? 'Edit Buku' : 'Tambah Buku' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Tutup</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label position="floating">Judul</ion-label>
    <ion-input [(ngModel)]="title"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Penulis</ion-label>
    <ion-input [(ngModel)]="author"></ion-input>
  </ion-item>

  <ion-button expand="block" (click)="save()">
    Simpan
  </ion-button>

</ion-content>
